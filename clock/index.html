<title>Bandar Seri Begawan Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500&family=Martian+Mono:wght@300;400&display=swap">
<style>
/* Layout: a single full-bleed scene canvas; a quiet typographic clock floats above the river skyline. */
:root{
  color-scheme: dark;
  --sky: #0b0f26;
  --ink: #efebe2;
  --ink-2: rgba(239,235,226,.62);
  --ink-3: rgba(239,235,226,.28);
  --rule: #e2544a;
  --chip: rgba(239,235,226,.10);
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root.day{ --ink:#141a33; --ink-2:rgba(20,26,51,.66); --ink-3:rgba(20,26,51,.28); --chip:rgba(20,26,51,.08); --rule:#d23f35; }
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:var(--sky);color:var(--ink);font-family:var(--display);overflow:hidden;
  transition:color 1.2s ease;-webkit-user-select:none;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));
  padding-block:calc(14px + env(safe-area-inset-top, 0px)) env(safe-area-inset-bottom, 0px);max-width:560px;margin:0 auto;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chip{font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);
  background:var(--chip);border:0;border-radius:999px;padding:9px 13px;cursor:pointer;transition:color 1.2s, background 1.2s}
.chip:focus-visible{outline:2px solid var(--rule);outline-offset:2px}
.view{display:flex;align-items:center;gap:8px;font:400 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--rule)}

.clock{margin-top:clamp(28px,7vh,72px);display:grid;grid-template-columns:auto 2px 1fr;column-gap:clamp(12px,3.5vw,22px);align-items:stretch}
.hm{display:flex;flex-direction:column;font-weight:400;font-size:min(31vw,19vh,178px);line-height:.86;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.hm span{display:block}
.rule{background:var(--rule);position:relative;border-radius:1px}
.rule::before,.rule::after{content:"";position:absolute;left:50%;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--rule)}
.rule::before{top:-5px}.rule::after{bottom:-5px}
.side{display:flex;flex-direction:column;justify-content:space-between;padding-block:.4em;min-width:0}
.label{font:400 clamp(10px,2.9vw,14px)/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.dnum{font-size:clamp(30px,10vw,58px);line-height:1;letter-spacing:-.03em;margin:.18em 0 .16em;font-variant-numeric:tabular-nums}
.secs{position:relative;height:clamp(54px,16vw,92px);overflow:hidden;font-size:clamp(34px,11vw,62px);letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.reel{position:absolute;left:0;top:0;display:flex;flex-direction:column}
.reel span{height:clamp(54px,16vw,92px);display:flex;align-items:center}
.reel.go{transition:transform .55s cubic-bezier(.2,.8,.2,1)}

.city{margin-top:clamp(22px,5vh,48px)}
.name{font-size:clamp(36px,11.5vw,66px);line-height:.98;letter-spacing:-.03em;text-wrap:balance;margin:0;font-weight:400}
.sub{margin-top:10px;font-size:clamp(14px,4.2vw,18px);color:var(--ink-2);min-height:1.3em;transition:opacity .6s}
.meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px;font:300 clamp(10.5px,3vw,13px)/1.4 var(--mono);color:var(--ink-2);letter-spacing:.02em}
.meta b{font-weight:400;color:var(--ink)}
.moonicon{display:inline-block;width:.95em;height:.95em;vertical-align:-.12em;margin-right:6px}
@media (prefers-reduced-motion: reduce){.reel.go{transition:none}}
</style>

</head>

<canvas id="scene" aria-hidden="true"></canvas>
<main class="ui">
  <div class="top">
    <div class="view"><span class="dot"></span><span>BSB · UTC+08</span></div>
    <button class="chip" id="awake" type="button">Keep screen on</button>
  </div>

  <section class="clock" aria-live="off">
    <div class="hm"><span id="hh">--</span><span id="mm">--</span></div>
    <div class="rule"></div>
    <div class="side">
      <div>
        <div class="label" id="wday">—</div>
        <div class="dnum" id="dnum">--</div>
        <div class="label" id="mon">—</div>
      </div>
      <div class="secs"><div class="reel" id="reel"><span>--</span><span>--</span><span>--</span></div></div>
    </div>
  </section>

  <section class="city">
    <h1 class="name">Bandar Seri Begawan</h1>
    <div class="sub" id="sub">Over the Brunei River</div>
    <div class="meta">
      <span><svg class="moonicon" id="moonicon" viewBox="-10 -10 20 20"></svg><b id="phase">—</b></span>
      <span id="sun">—</span>
      <span>4°53′N 114°56′E</span>
    </div>
  </section>

/* ---------- time in Brunei (UTC+8) regardless of device zone ---------- */
const PREVIEW = { dawn: 6.1, noon: 12.5, dusk: 18.25, night: 21.5 };
const pv = PREVIEW[(location.hash || '').slice(1)];
function bsbNow(){
  const d = new Date(Date.now() + 8 * 3600e3);
  if (pv !== undefined){ const base = new Date(d); base.setUTCHours(0,0,0,0); return new Date(base.getTime() + pv*3600e3 + (Date.now()%60000)); }
  return d; // read with getUTC* = Brunei wall time
}
const WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MO = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad = n => String(n).padStart(2,'0');

/* sunrise / sunset (NOAA approximation) for BSB */
const LAT = 4.89, LON = 114.94;
function sunTimes(d){
  const start = Date.UTC(d.getUTCFullYear(),0,1);
  const N = Math.floor((d - start)/864e5) + 1;
  const g = 2*Math.PI/365*(N-1);
  const eq = 229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec = 0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const r = Math.PI/180, la = LAT*r;
  const ha = Math.acos(Math.cos(90.833*r)/(Math.cos(la)*Math.cos(dec)) - Math.tan(la)*Math.tan(dec))/r;
  return { rise: 720 - 4*(LON+ha) - eq + 480, set: 720 - 4*(LON-ha) - eq + 480 }; // minutes, Brunei time
}
/* moon phase from a reference new moon */
function moonPhase(){
  const syn = 29.530588853, ref = Date.UTC(2000,0,6,18,14);
  let p = ((Date.now() - ref)/864e5 / syn) % 1; if (p < 0) p += 1; return p;
}
function phaseName(p){
  const n = ['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
  return n[Math.round(p*8) % 8];
}
function moonPath(p, R){
  // lit region of a disc of radius R, as an SVG/canvas-friendly description
  const k = Math.cos(2*Math.PI*p); // 1 new, -1 full
  const waxing = p < .5;
  return { k, waxing };
}
function drawMoon(ctx, x, y, R, p, lit, dark){
  const { k, waxing } = moonPath(p, R);
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = lit; ctx.beginPath();
  const s = waxing ? 1 : -1;
  ctx.arc(0,0,R,-Math.PI/2,Math.PI/2, s<0);         // lit limb half
  ctx.ellipse(0,0,Math.abs(k)*R,R,0,Math.PI/2,-Math.PI/2, (k>0) === (s>0) ? true : false);
  ctx.fill(); ctx.restore();
}

/* ---------- DOM clock ---------- */
const $ = id => document.getElementById(id);
let lastSec = -1;
const reel = $('reel');
function tickUI(){
  const d = bsbNow();
  const s = d.getUTCSeconds();
  if (s === lastSec) return; lastSec = s;
  $('hh').textContent = pad(d.getUTCHours());
  $('mm').textContent = pad(d.getUTCMinutes());
  $('wday').textContent = WD[d.getUTCDay()];
  $('dnum').textContent = d.getUTCDate();
  $('mon').textContent = MO[d.getUTCMonth()];
  // odometer: prev / current / next, then roll
  const spans = reel.children, h = spans[0].getBoundingClientRect().height;
  spans[0].textContent = pad((s+59)%60); spans[1].textContent = pad(s); spans[2].textContent = pad((s+1)%60);
  reel.classList.remove('go'); reel.style.transform = `translateY(${0}px)`;
  void reel.offsetHeight;
  reel.classList.add('go'); reel.style.transform = `translateY(${-h + 0}px)`;
  // meta once per second is plenty
  const st = sunTimes(d);
  const fm = m => pad(Math.floor(m/60)) + ':' + pad(Math.floor(m%60));
  $('sun').textContent = `${fm(st.rise)} – ${fm(st.set)}`;
  const p = moonPhase();
  $('phase').textContent = phaseName(p);
  const svg = $('moonicon');
  const k = Math.cos(2*Math.PI*p), w = p<.5?1:0;
  svg.innerHTML = `<circle r="9" fill="none" stroke="currentColor" stroke-width="1.2"/>` +
    `<path fill="currentColor" d="M0,-9 A9,9 0 0 ${w} 0,9 A${(Math.abs(k)*9).toFixed(2)},9 0 0 ${(k>0)===(p<.5)?0:1} 0,-9Z"/>`;
}
// initial reel position so the current second sits in the window
reel.style.transform = 'translateY(0)';

/* ---------- scene ---------- */
const cv = $('scene'), ctx = cv.getContext('2d');
let DPR = 1, CW = 0, CH = 0;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = cv.clientWidth; CH = cv.clientHeight;
  cv.width = Math.round(CW*DPR); cv.height = Math.round(CH*DPR);
}
addEventListener('resize', resize); resize();

  { sub: 'Omar Ali Saifuddien Mosque', z: 1.30, f: 600 },
  { sub: 'Kampong Ayer', z: 1.32, f: 1010 },
  { sub: 'The lagoon and the royal barge', z: 1.22, f: 300 },
];
const VIEW_MS = 16000;
const stars = Array.from({length:120}, () => ({ x: Math.random(), y: Math.random()*0.62, r: Math.random()*1.2+.4, ph: Math.random()*6.28, sp: .6+Math.random()*1.4 }));
const ripples = Array.from({length:70}, () => ({ x: Math.random(), y: Math.random(), l: 14+Math.random()*60, ph: Math.random()*6.28 }));
const off = document.createElement('canvas'); const octx = off.getContext('2d');

const lerp = (a,b,t) => a+(b-a)*t;
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const smooth = (a,b,x) => { const t = Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const mix = (c1,c2,t) => c1.map((v,i)=>Math.round(lerp(v,c2[i],t)));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

const NIGHT = { top:[11,15,38], hor:[30,36,82], wTop:[18,22,54], wBot:[8,11,30] };
const DAYC  = { top:[66,128,210], hor:[178,212,240], wTop:[70,118,170], wBot:[34,70,120] };
const GOLD  = [240,160,110];

let lastSub = '';
function frame(ts){
  tickUI();
  const d = bsbNow();
  const mins = d.getUTCHours()*60 + d.getUTCMinutes() + d.getUTCSeconds()/60;
  const st = sunTimes(d);
  const day = smooth(st.rise-25, st.rise+35, mins) * (1 - smooth(st.set-35, st.set+25, mins));
  const golden = Math.max(Math.exp(-Math.pow((mins-st.rise)/45,2)), Math.exp(-Math.pow((mins-st.set)/45,2)));
  document.documentElement.classList.toggle('day', day > .55);

  // camera: glide between views
  const t = ts / VIEW_MS, i = Math.floor(t) % VIEWS.length, u = t % 1;
  const a = VIEWS[i], b = VIEWS[(i+1) % VIEWS.length];
  const m = ease(smooth(.55, 1, u));
  const cam = { z: lerp(a.z,b.z,m), f: lerp(a.f,b.f,m) + Math.sin(ts/5200)*14 };
  const sub = m < .5 ? a.sub : b.sub;
  if (sub !== lastSub){ lastSub = sub; const el = $('sub'); el.style.opacity = 0; setTimeout(()=>{ el.textContent = sub; el.style.opacity = 1; }, 350); }

  ctx.setTransform(DPR,0,0,DPR,0,0);
  // world -> screen: cover the width, keep the skyline in the lower ~42%
  const sc = Math.max(CW/WW, CH*0.36/WH);
  const ox = (CW - WW*sc)/2, oy = CH - WH*sc;
  const horY = oy + HZ*sc;

  // sky
  let top = mix(NIGHT.top, DAYC.top, day), hor = mix(NIGHT.hor, DAYC.hor, day);
  hor = mix(hor, GOLD, golden*.65); top = mix(top, [70,60,120], golden*.35);
  document.body.style.background = rgb(top);
  const g = ctx.createLinearGradient(0,0,0,horY);
  g.addColorStop(0, rgb(top)); g.addColorStop(.55, rgb(mix(top,hor,.35))); g.addColorStop(1, rgb(hor));
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,horY+1);

  // stars
  const na = 1 - day;
  if (na > .02) for (const s of stars){
    const al = na * (.35 + .65*(.5+.5*Math.sin(ts/1000*s.sp + s.ph))) * (1 - s.y/0.62*.5);
    ctx.fillStyle = `rgba(225,228,245,${al.toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x*CW, s.y*horY, s.r, 0, 6.283); ctx.fill();
  }

  // layer transform helper (parallax by depth k)
  const L = (k) => {
    const z = 1 + k*(cam.z-1), fx = 645 + k*(cam.f-645);
    ctx.setTransform(DPR*sc*z, 0, 0, DPR*sc*z, DPR*(ox + (645 - fx*z)*sc), DPR*(oy + (HZ - HZ*z)*sc));
  };

  // sun or moon
  const p = moonPhase();
  L(0.3);
  if (day > .05){
    const arc = Math.min(1, Math.max(0, (mins - st.rise)/(st.set - st.rise)));
    const sx = lerp(80, 1210, arc), sy = HZ - 40 - Math.sin(arc*Math.PI)*560;
    ctx.globalAlpha = day;
    const sg = ctx.createRadialGradient(sx,sy,0,sx,sy,120);
    sg.addColorStop(0,'rgba(255,240,200,.9)'); sg.addColorStop(.25,'rgba(255,230,170,.35)'); sg.addColorStop(1,'rgba(255,230,170,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx,sy,120,0,6.283); ctx.fill();
    ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.arc(sx,sy,30,0,6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (na > .05){
    ctx.globalAlpha = na;
    const mg = ctx.createRadialGradient(1035,180,0,1035,180,110);
    mg.addColorStop(0,'rgba(200,200,230,.35)'); mg.addColorStop(1,'rgba(200,200,230,0)');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(1035,180,110,0,6.283); ctx.fill();
    drawMoon(ctx, 1035, 180, 40, p, '#f6ecd0', 'rgba(40,46,92,.9)');
    ctx.globalAlpha = 1;
  }

  // clouds (drift, wrap)
  L(0.5);
  const cl = [[300,235,0,9],[860,290,1,-7],[120,370,2,6],[1180,360,3,-8]];
  for (const [cx,cy,n,v] of cl){
    const im = imgs['cloud'+n]; if (!im.complete) continue;
    let x = ((cx + v*ts/1000 + 400) % 2090 + 2090) % 2090 - 400;
    ctx.globalAlpha = .9;
    ctx.filter = day > .02 ? `brightness(${(1+day*3.2).toFixed(2)}) saturate(${(1-day*.6).toFixed(2)})` : 'none';
    ctx.drawImage(im, x - im.width/2, cy - im.height/2);
    ctx.filter = 'none'; ctx.globalAlpha = 1;
  }

  // compose far + mosque (night/day blend) into offscreen for reflection
  const drawPair = (c, name) => {
    const n = imgs[name], dd = imgs[name+'_day'];
    if (n.complete){ c.globalAlpha = 1; c.drawImage(n,0,0); }
    if (day > .01 && dd.complete){ c.globalAlpha = day; c.drawImage(dd,0,0); c.globalAlpha = 1; }
  };
  const dayFilter = day > .02 ? `brightness(${(1+day*1.4).toFixed(2)}) saturate(${(1-day*.25).toFixed(2)})` : 'none';

  // water
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const wg = ctx.createLinearGradient(0,horY,0,CH);
  wg.addColorStop(0, rgb(mix(mix(NIGHT.wTop,DAYC.wTop,day),GOLD,golden*.3))); wg.addColorStop(1, rgb(mix(NIGHT.wBot,DAYC.wBot,day)));
  ctx.fillStyle = wg; ctx.fillRect(0,horY,CW,CH-horY);

  // reflection: render upper scene to offscreen at screen scale, then slice-flip with ripple
  const rw = Math.ceil(CW*DPR), rh = Math.ceil(horY*DPR);
  if (off.width !== rw || off.height !== rh){ off.width = rw; off.height = rh; }
  octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,rw,rh);
  for (const [k,name] of [[0.7,'far'],[1.0,'mosque']]){
    const z = 1 + k*(cam.z-1), fx = 645 + k*(cam.f-645);
    octx.setTransform(DPR*sc*z,0,0,DPR*sc*z, DPR*(ox + (645 - fx*z)*sc), DPR*(oy + (HZ - HZ*z)*sc));
    octx.filter = name==='mosque' ? 'none' : dayFilter; drawPair(octx, name); octx.filter = 'none';
  }
  ctx.setTransform(1,0,0,1,0,0);
  const rLen = Math.min(rh, (CH-horY)*DPR*1.4), step = 3*DPR;
  for (let yy = 0; yy < rLen; yy += step){
    const srcY = rh - yy*0.75 - step;
    if (srcY < 0) break;
    const offx = (Math.sin(yy/(7*DPR) + ts/260) * 3 + Math.sin(yy/(31*DPR) - ts/900) * 2 + Math.sin(yy*1.7 + ts/180)*1.2) * DPR;
    ctx.globalAlpha = .30 * (1 - yy/rLen) * (1 - day*.35);
    ctx.save(); ctx.translate(offx, horY*DPR + yy); ctx.scale(1,-1);
    ctx.drawImage(off, 0, srcY, rw, step*0.75, 0, -step, rw, step);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // skyline layers
  for (const [k,name] of [[0.7,'far'],[1.0,'mosque']]){ L(k); ctx.filter = name==='mosque' ? 'none' : dayFilter; drawPair(ctx, name); ctx.filter = 'none'; }

  // ripples + moon glitter
  ctx.setTransform(DPR,0,0,DPR,0,0);
  for (const r of ripples){
    const y = horY + 6 + r.y*(CH-horY-10), tt = r.y;
    const al = (.28*(1-tt)+.06) * (.5+.5*Math.sin(ts/900 + r.ph));
    const x = r.x*CW + Math.sin(ts/1400 + r.ph)*10;
    ctx.strokeStyle = day > .5 ? `rgba(255,255,255,${al})` : `rgba(150,160,220,${al})`;
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+r.l*(1-tt*.5),y); ctx.stroke();
  }

  // foreground: kampong + water taxi
  L(1.35); ctx.filter = dayFilter; drawPair(ctx,'kampong');
  const bx = ((ts/1000*18) % 1700) - 200, by = 850 + Math.sin(ts/450)*3;
  const bimg = day > .5 ? imgs['boat_day'] : imgs['boat'];
  if (bimg.complete){ ctx.drawImage(bimg, bx, by); }
  ctx.filter = 'none';
  // wake
  ctx.strokeStyle = `rgba(200,210,255,${.25*(1-day*.4)})`; ctx.lineWidth = 2;
  for (let w=1; w<4; w++){ ctx.beginPath(); ctx.moveTo(bx + 80 - w*34, by + 62 + w*3); ctx.lineTo(bx + 100 - w*34 - 30, by + 62 + w*3); ctx.stroke(); }

  // bottom fade
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const bf = ctx.createLinearGradient(0,CH-120,0,CH);
  bf.addColorStop(0,'rgba(5,7,18,0)'); bf.addColorStop(1,'rgba(5,7,18,.55)');
  ctx.fillStyle = bf; ctx.fillRect(0,CH-120,CW,120);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* keep the screen on while visible (if allowed) */
let lock = null;
async function wake(){
  try { lock = await navigator.wakeLock.request('screen'); $('awake').textContent = 'Screen stays on'; lock.addEventListener('release', () => { $('awake').textContent = 'Keep screen on'; }); }
  catch(e){ $('awake').textContent = 'Screen lock: use Auto-Lock off'; }
}
$('awake').addEventListener('click', wake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && lock) wake(); });
</script>

</body>
</html>
