<title>Waktu Sembahyang Brunei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one quiet column — next prayer and countdown on top, the day's eight times as a ruled list below. */
:root{
  --bg:#f4f3ef; --fg:#141a33; --muted:rgba(20,26,51,.55); --line:rgba(20,26,51,.12); --accent:#c8402f; --now:rgba(200,64,47,.08);
  --display:"Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0f26;--fg:#efebe2;--muted:rgba(239,235,226,.55);--line:rgba(239,235,226,.12);--accent:#e2544a;--now:rgba(226,84,74,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f26;--fg:#efebe2;--muted:rgba(239,235,226,.55);--line:rgba(239,235,226,.12);--accent:#e2544a;--now:rgba(226,84,74,.12);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--display);-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px));padding-block:calc(20px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px))}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.date{font:400 12px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
select{font:400 12px var(--mono);letter-spacing:.04em;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 12px;appearance:none;-webkit-appearance:none}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.next{margin-top:clamp(40px,12vh,110px)}
.label{font:400 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.name{font-size:clamp(52px,16vw,84px);line-height:.95;letter-spacing:-.035em;margin:.25em 0 0;font-weight:400}
.count{margin-top:14px;font:300 clamp(22px,7vw,32px)/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.at{margin-top:8px;color:var(--muted);font-size:15px}

ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;justify-content:space-between;align-items:baseline;padding:13px 10px;border-bottom:1px solid var(--line);font-size:17px}
li .t{font:400 16px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
li.minor{color:var(--muted)}
li.minor .t{font-size:14px}
li.now{background:var(--now)}
li.now span:first-child::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:10px;vertical-align:.15em}
li.past{opacity:.45}

.days{margin-top:clamp(36px,8vh,72px);display:flex;align-items:center;gap:8px}
.days button,.pick{font:400 12px/1 var(--mono);letter-spacing:.04em;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 13px;cursor:pointer}
.days .arrow{width:36px;padding:9px 0;text-align:center;font-size:15px}
.days .pick{flex:1;text-align:center;text-transform:uppercase;display:flex;justify-content:center;align-items:center;gap:8px}
.pick .chev{font-size:9px;transition:transform .2s}
.pick[aria-expanded="true"] .chev{transform:rotate(180deg)}
.days button:focus-visible,.cal button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cal{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:14px 12px 10px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-head .m{font-size:17px}
.cal-head button{font:400 15px/1 var(--mono);color:var(--fg);background:transparent;border:0;width:36px;height:32px;border-radius:999px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid .wd{font:400 10px/1 var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:6px 0 8px}
.grid .wd.fri{color:var(--accent)}
.grid button{font:400 15px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--fg);background:transparent;border:0;border-radius:999px;aspect-ratio:1;max-width:44px;width:100%;margin:0 auto;cursor:pointer;position:relative}
.grid button.fri{color:var(--accent)}
.grid button.today::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.grid button.sel{background:var(--fg);color:var(--bg)}
.grid button.sel.today::after{background:var(--bg)}
.cal-foot{display:flex;justify-content:flex-end;margin-top:6px}
.cal-foot button{font:400 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:transparent;border:0;padding:8px 6px;cursor:pointer}
#today[hidden]{display:none}
.days + ol{margin-top:14px}

.foot{margin-top:auto;padding-top:28px;font:300 11px/1.6 var(--mono);color:var(--muted);letter-spacing:.02em}
.foot a{color:inherit}
</style>

</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="date" id="date">—</div>
    <label for="district" class="date" style="position:absolute;left:-9999px">District</label>
    <select id="district" aria-label="District">
      <option value="0">Brunei-Muara</option>
      <option value="1">Tutong</option>
      <option value="3">Belait</option>
      <option value="0t">Temburong</option>
    </select>
  </div>

  <section class="next" aria-live="polite">
    <div class="label">Seterusnya</div>
    <h1 class="name" id="nextName">—</h1>
    <div class="count" id="count">--:--:--</div>
    <div class="at" id="nextAt">—</div>
  </section>

  <div class="days" role="group" aria-label="Pilih tarikh">
    <button type="button" class="arrow" id="prev" aria-label="Hari sebelumnya">‹</button>
    <button type="button" class="pick" id="pick" aria-expanded="false" aria-controls="cal"><span id="dayLabel">Hari ini</span><span class="chev" aria-hidden="true">▼</span></button>
    <button type="button" class="arrow" id="nextDay" aria-label="Hari berikutnya">›</button>
    <button type="button" id="today" hidden>Hari ini</button>
  </div>
  <div class="cal" id="cal" hidden>
    <div class="cal-head">
      <button type="button" id="mPrev" aria-label="Bulan sebelumnya">‹</button>
      <div class="m" id="mLabel">—</div>
      <button type="button" id="mNext" aria-label="Bulan berikutnya">›</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="cal-foot"><button type="button" id="calToday">Hari ini</button></div>
  </div>
  <ol id="list"></ol>

  <div class="foot">
    <span id="src">Waktu Solat 2026. Data daripada Taqwim Hijrah.</span> Tutong +1 min, Belait +3 min.<br>
    Aplikasi tidak rasmi, bukan terbitan kerajaan.
  </div>
</div>

<script>
/* 2026: KHEU's official Taqwim 2026 times, entered day by day.
   Other years: fallback calculation (Suboh 20°, Isyak 18°, Asar Syafi'i), usually within a minute. */
const LAT = 4.8903, LON = 114.9420, TZ = 8;
const R = Math.PI/180;
function jd(y,m,d){ if(m<=2){y--;m+=12} const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function sun(j){ const D=j-2451545, g=((357.529+0.98560028*D)%360)*R, q=(280.459+0.98564736*D)%360;
  const L=((q+1.915*Math.sin(g)+0.020*Math.sin(2*g))%360)*R, e=(23.439-0.00000036*D)*R;
  const RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/R/15, dec=Math.asin(Math.sin(e)*Math.sin(L));
  let eq=q/15-(((RA%24)+24)%24); eq=((eq+12)%24+24)%24-12; return {dec,eq}; }
function ha(alt,dec){ const la=LAT*R; let c=(Math.sin(alt*R)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec));
  return Math.acos(Math.max(-1,Math.min(1,c)))/R/15; }
function times(y,m,d){
  if(y===OFFICIAL_YEAR){ const r=OFFICIAL[String(m).padStart(2,'0')+String(d).padStart(2,'0')]; if(r){ const o={}; ['Imsak','Suboh','Syuruk','Doha','Zohor','Asar','Maghrib','Isyak'].forEach((k,i)=>o[k]=r[i]); return o; } }
  return calc(y,m,d);
}
function calc(y,m,d){
  const {dec,eq}=sun(jd(y,m,d)+0.5-TZ/24), noon=12+TZ-LON/15-eq;
  const asrAlt=Math.atan(1/(1+Math.tan(Math.abs(LAT*R-dec))))/R;

const ORDER=['Imsak','Suboh','Syuruk','Doha','Zohor','Asar','Maghrib','Isyak'];
const MINOR=new Set(['Imsak','Syuruk','Doha']);           // shown, but not counted as "next prayer"
const HARI=['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'];
const BULAN=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const pad=n=>String(n).padStart(2,'0');
const hm=min=>{ min=((min%1440)+1440)%1440; let h=Math.floor(min/60), m=min%60; const h12=h%12||12; return `${h12}:${pad(m)}`; };

const sel=document.getElementById('district');
try{ const v=localStorage.getItem('district'); if(v!==null) sel.value=v; }catch(e){}
sel.addEventListener('change',()=>{ try{localStorage.setItem('district',sel.value)}catch(e){} render(true); });

let lastKey='', view=0;   // view = days from today
const SHORT=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
function shift(n){ view=n; render(true); if(!cal.hidden) openCal(true); }
document.getElementById('prev').addEventListener('click',()=>shift(view-1));
document.getElementById('nextDay').addEventListener('click',()=>shift(view+1));
document.getElementById('today').addEventListener('click',()=>shift(0));
const cal=document.getElementById('cal'), pickBtn=document.getElementById('pick');
let calY=0, calM=0;   // month shown in the calendar
function todayUTC(){ const n=bsb(); return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()); }
function openCal(open){
  cal.hidden=!open; pickBtn.setAttribute('aria-expanded',String(open));
  if(open){ const v=new Date(todayUTC()+view*864e5); calY=v.getUTCFullYear(); calM=v.getUTCMonth(); drawCal(); }
}
pickBtn.addEventListener('click',()=>openCal(cal.hidden));
document.getElementById('mPrev').addEventListener('click',()=>{ calM--; if(calM<0){calM=11;calY--;} drawCal(); });
document.getElementById('mNext').addEventListener('click',()=>{ calM++; if(calM>11){calM=0;calY++;} drawCal(); });
document.getElementById('calToday').addEventListener('click',()=>{ openCal(false); shift(0); });
function drawCal(){
  document.getElementById('mLabel').textContent=`${BULAN[calM]} ${calY}`;
  const g=document.getElementById('grid'); g.innerHTML='';
  ['Ah','Is','Se','Ra','Kh','Ju','Sa'].forEach((w,i)=>{ const e=document.createElement('div'); e.className='wd'+(i===5?' fri':''); e.textContent=w; g.appendChild(e); });
  const first=new Date(Date.UTC(calY,calM,1)).getUTCDay(), days=new Date(Date.UTC(calY,calM+1,0)).getUTCDate();
  for(let i=0;i<first;i++) g.appendChild(document.createElement('div'));
  const t0=todayUTC(), selT=t0+view*864e5;
  for(let d=1; d<=days; d++){
    const ts=Date.UTC(calY,calM,d), b=document.createElement('button'); b.type='button'; b.textContent=d;
    const dow=new Date(ts).getUTCDay(); if(dow===5) b.classList.add('fri');
    if(ts===t0) b.classList.add('today'); if(ts===selT) b.classList.add('sel');
    b.setAttribute('aria-label',`${HARI[dow]}, ${d} ${BULAN[calM]} ${calY}`);
    b.addEventListener('click',()=>{ openCal(false); shift(Math.round((ts-t0)/864e5)); });
    g.appendChild(b);
  }
}
function bsb(){ return new Date(Date.now()+TZ*3600e3); }   // read with getUTC* = Brunei time
function render(force){
  const n=bsb(), y=n.getUTCFullYear(), mo=n.getUTCMonth()+1, d=n.getUTCDate();
  const nowMin=n.getUTCHours()*60+n.getUTCMinutes()+n.getUTCSeconds()/60;
  const add=parseInt(sel.value,10);
  const t=times(y,mo,d); for(const k in t) t[k]+=add;
  // next prayer (main five), rolling to tomorrow's Suboh after Isyak
  let next=null;
  for(const k of ORDER){ if(MINOR.has(k)||k==='Imsak') continue; if(t[k]>nowMin){ next={k,at:t[k]}; break; } }
  if(!next){ const tm=new Date(Date.UTC(y,mo-1,d+1)); const t2=times(tm.getUTCFullYear(),tm.getUTCMonth()+1,tm.getUTCDate()); next={k:'Suboh',at:t2.Suboh+add+1440}; }
  const left=Math.max(0,Math.round((next.at-nowMin)*60));
  document.getElementById('count').textContent=`${pad(Math.floor(left/3600))}:${pad(Math.floor(left/60)%60)}:${pad(left%60)}`;
  const label=k=>(k==='Zohor'&&n.getUTCDay()===5)?'Jumaat':k;
  const key=`${y}-${mo}-${d}-${sel.value}-${next.k}-${view}`;
  if(key===lastKey && !force) return; lastKey=key;
  document.getElementById('date').textContent=`${HARI[n.getUTCDay()]}, ${d} ${BULAN[mo-1]} ${y}`;
  document.getElementById('nextName').textContent=label(next.k);
  document.getElementById('nextAt').textContent=`pada ${hm(next.at)} ${next.at%1440<720?'pagi':(next.at%1440<1140?'petang':'malam')}`;
  // list for the chosen day (today by default)
  const vd=new Date(Date.UTC(y,mo-1,d+view)), vy=vd.getUTCFullYear(), vm=vd.getUTCMonth()+1, vdd=vd.getUTCDate(), vdow=vd.getUTCDay();
  const vt=view===0?t:times(vy,vm,vdd); if(view!==0) for(const k in vt) vt[k]+=add;
  const vlabel=k=>(k==='Zohor'&&vdow===5)?'Jumaat':k;
  document.getElementById('dayLabel').textContent = view===0 ? 'Hari ini' : view===1 ? 'Esok' : view===-1 ? 'Semalam' : `${HARI[vdow].slice(0,3)}, ${vdd} ${SHORT[vm-1]}${vy!==y?' '+vy:''}`;
  document.getElementById('today').hidden = view===0;
  document.getElementById('src').textContent = vy===OFFICIAL_YEAR ? 'Waktu Solat 2026. Data daripada Taqwim Hijrah.' : 'Anggaran kiraan, Taqwim '+vy+' belum dimasukkan.';
  let cur=null; if(view===0) for(const k of ORDER){ if(!MINOR.has(k)&&k!=='Imsak'&&t[k]<=nowMin) cur=k; }
  const ol=document.getElementById('list'); ol.innerHTML='';
  for(const k of ORDER){
    const li=document.createElement('li');
    if(MINOR.has(k)) li.classList.add('minor');
    if(view===0){ if(k===cur) li.classList.add('now'); else if(vt[k]<=nowMin) li.classList.add('past'); }
    li.innerHTML=`<span>${vlabel(k)}</span><span class="t">${hm(vt[k])}</span>`;
    ol.appendChild(li);
  }
}
render(true); setInterval(render,1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(true); });
